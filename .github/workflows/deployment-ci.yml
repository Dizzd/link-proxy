name: Deployment files
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release packaging
        run: python3 -m unittest discover -s scripts -p test_package_release.py -v
      - name: Generate a disposable validation bundle
        run: |
          python3 scripts/package_release.py --repository example/link-proxy --version ci \
            --image "ghcr.io/example/link-proxy@sha256:$(printf '0%.0s' {1..64})" --output release-validation
      - name: Validate all Compose service combinations
        run: python3 scripts/validate_release.py release-validation
      - name: Validate source-build Compose combinations
        run: python3 scripts/validate_release.py release-validation --source-compose docker-compose.yml

[workspace]
resolver = "2"
members = ["apps/proxy-server", "crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
argon2 = "0.5.3"
anyhow = "1"
arc-swap = "1.7"
async-trait = { version = "0.1" }
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
calamine = "0.31"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = "1.3"
http = "1"
ipnet = { version = "2", features = ["serde"] }
matchit = "0.8"
pingora = { version = "0.9", features = ["proxy", "openssl"] }
prometheus = "0.14"
redis = { version = "0.32", features = ["tokio-comp", "tokio-rustls-comp"] }
rust_xlsxwriter = "0.90"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "any", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
# Pingora 0.9 constructs zero-capacity BufStream; Tokio >=1.54 panics (upstream issue #1059).
tokio = { version = "=1.53.2", features = ["full"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "4", default-features = false, features = ["deflate"] }


proxy-domain = { path = "crates/proxy-domain" }
proxy-routing = { path = "crates/proxy-routing" }
proxy-pingora = { path = "crates/proxy-pingora" }
proxy-admin-api = { path = "crates/proxy-admin-api" }
proxy-application = { path = "crates/proxy-application" }
proxy-storage = { path = "crates/proxy-storage" }
proxy-cache = { path = "crates/proxy-cache" }
proxy-import = { path = "crates/proxy-import" }
proxy-observability = { path = "crates/proxy-observability" }
proxy-e2e = { path = "crates/proxy-e2e" }

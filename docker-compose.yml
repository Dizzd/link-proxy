# Source-build deployment. Published releases provide an image-only version of this file.
services:
  proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/proxy.db}
      PROXY_CONFIG: /app/config.toml
      CACHE_MODE: ${CACHE_MODE:-memory}
      REDIS_URL: redis://redis:6379/0
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${PROXY_BIND_IP:-127.0.0.1}:${PROXY_PORT:-8080}:8080"
      - "127.0.0.1:${ADMIN_PORT:-9000}:9000"
    volumes:
      - proxy-data:/data
      - ./config/config.docker.toml:/app/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
  postgres:
    image: postgres:16-bookworm
    profiles: [postgres]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proxy}
      POSTGRES_DB: ${POSTGRES_DB:-proxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    profiles: [redis]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped
volumes:
  proxy-data:
  postgres-data:
  caddy-data:
  caddy-config:
  redis-data:
